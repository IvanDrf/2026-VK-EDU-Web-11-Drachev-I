<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>AskHub - сайт для вопросов и обсуждений</title>
</head>

<body>
    <header>
        <div class="search-header">
            <div class="header-left">
                <a href="/" class="no-underline-link">
                    <h1>AskHub</h1>
                </a>
            </div>

            <div class="header-center">
                <div class="input-group search-input">
                    <input type="text" class="form-control" placeholder="Какая тема интересует" aria-label="Поиск темы"
                        aria-describedby="button-addon2">
                    <button class="btn btn-outline-success" type="button" id="button-addon2">Найти</button>
                </div>
                <a href="ask.html" class="btn btn-primary ask-btn">Задать вопрос</a>
            </div>

            <div class="header-user-info header-right">
                <img src="static/img/user.png" alt="Аватарка" class="user-avatar">
                <div class="header-user-actions">
                    <span class="user-name">IvanDrf</span>
                    <div class="user-links">
                        <a href="settings.html" class="no-underline-link">Настройки</a>
                        <a href="/login.html" class="no-underline-link">Выйти</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container my-4">
        <div class="row g-4 justify-content-center">

            <main class="col-lg-7 col-xl-6">

                <div class="card question-card">
                    <div class="card-body">

                        <h1 class="auth-title">Настройки профиля</h1>
                        <p class="auth-subtitle">Измените данные аккаунта и сохраните изменения.</p>

                        <form action="">
                            <div class="mb-4 avatar-upload">
                                <label class="form-label">Аватарка</label>
                                <div class="avatar-upload-row">
                                    <div class="avatar-preview">
                                        <img src="static/img/user.png" alt="Превью аватарки" id="avatar-preview-img">
                                    </div>
                                    <div class="avatar-upload-controls">
                                        <label for="avatar" class="btn btn-outline-secondary btn-sm">
                                            Заменить
                                        </label>
                                        <input type="file" id="avatar" name="avatar" accept="image/*" hidden>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control" id="username" name="username"
                                    autocomplete="username" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" autocomplete="email"
                                    required>
                            </div>

                            <div class="d-flex justify-content-end pt-3 mt-3 border-top">
                                <a href="/" class="btn btn-outline-secondary me-2">Отмена</a>
                                <button type="submit" class="btn btn-primary">Сохранить</button>
                            </div>

                        </form>

                    </div>
                </div>


            </main>
            <aside class="col-lg-4 col-xl-3">
                <div class="sidebar-card">
                    <h6 class="sidebar-title">Популярные теги</h6>
                    <div class="sidebar-tags d-flex flex-wrap">
                        <a href="/tag.html" class="tag">python <span class="tag-count">124</span></a>
                        <a href="/tag.html" class="tag">javascript <span class="tag-count">98</span></a>
                        <a href="/tag.html" class="tag">django <span class="tag-count">76</span></a>
                        <a href="/tag.html" class="tag">react <span class="tag-count">61</span></a>
                        <a href="/tag.html" class="tag">fastapi <span class="tag-count">54</span></a>
                        <a href="/tag.html" class="tag">docker <span class="tag-count">43</span></a>
                        <a href="/tag.html" class="tag">postgresql <span class="tag-count">38</span></a>
                        <a href="/tag.html" class="tag">html <span class="tag-count">35</span></a>
                        <a href="/tag.html" class="tag">css <span class="tag-count">33</span></a>
                        <a href="/tag.html" class="tag">git <span class="tag-count">29</span></a>
                    </div>
                </div>
            </aside>


        </div>
    </div>

    <script src="static/js/bootstrap.min.js"></script>
</body>

</html>

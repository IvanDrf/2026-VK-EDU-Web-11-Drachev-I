{% load static %}
<div class="card question-card">
    <div class="card-body">
        <div class="d-flex">
            <div class="question-side d-flex flex-column align-items-center">
                <img src="{% static 'img/user.png' %}" alt="Аватарка" class="question-avatar">
                <span class="question-author" title="{{ question.author }}">{{ question.author }}</span>
                <div class="vote-box d-flex flex-column align-items-center">
                    <button type="button" class="btn btn-sm vote-up" aria-label="Нравится"
                        aria-pressed="false">▲</button>
                    <span class="vote-count fw-bold">{{ question.votes }}</span>
                    <button type="button" class="btn btn-sm vote-down" aria-label="Не нравится"
                        aria-pressed="false">▼</button>
                </div>
            </div>

            <div class="question-content flex-grow-1">
                <h5 class="card-title question-title" title="{{ question.title }}">
                    <a href="{% url 'question' question.id %}" class="no-underline-link">{{ question.title }}</a>
                </h5>
                <p class="card-text question-text" title="{{ question.text }}">{{ question.text }}</p>

                <div class="question-tags d-flex flex-wrap mt-3">
                    {% for tag in question.tags %}
                    <a href="{% url 'tag' tag %}" class="tag">{{ tag }}</a>
                    {% endfor %}
                </div>

                <div class="question-meta d-flex justify-content-between align-items-center mt-3">
                    <small class="question-date text-muted" title="Опубликовано {{ question.created_at }}">
                        {{ question.created_at }}
                    </small>
                    <a href="{% url 'question' question.id %}" class="question-answers badge rounded-pill">
                        {{ question.answers_count }} ответов
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

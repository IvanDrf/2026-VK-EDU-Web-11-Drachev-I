<div class="{{ spacing|default:'mb-3' }}">
    <label for="{{ id }}" class="form-label">{{ label }}</label>
    <input type="password" class="form-control" id="{{ id }}" name="{{ name }}"
        {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
        autocomplete="{{ autocomplete }}" required maxlength="128"
        {% if minlength %}minlength="{{ minlength }}"{% endif %}
        aria-describedby="{{ id }}-hint {{ id }}-error">
    <div id="{{ id }}-hint" class="form-text">{{ hint }}</div>
    <div id="{{ id }}-error" class="invalid-feedback field-error">{{ error }}</div>
</div>

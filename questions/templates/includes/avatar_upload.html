{% load static %}
<div class="mb-4 avatar-upload{% if form.avatar.errors %} has-errors{% endif %}">
    <label for="{{ form.avatar.id_for_label }}" class="form-label">{{ form.avatar.label }}</label>
    <div class="avatar-upload-row">
        <div class="avatar-preview">
            <img src="{% if user.is_authenticated and user.profile %}{{ user.profile.avatar_url }}{% else %}{% static 'img/user.png' %}{% endif %}" alt="Превью аватарки" id="avatar-preview-img">
        </div>
        <div class="avatar-upload-controls">
            {{ form.avatar }}
            <div id="{{ form.avatar.auto_id }}_helptext" class="form-text">{{ form.avatar.help_text }}</div>
            {% if form.avatar.errors %}<div id="{{ form.avatar.auto_id }}_errors" class="invalid-feedback d-block">{{ form.avatar.errors }}</div>{% endif %}
        </div>
    </div>
</div>

{% load static %}
<div class="question-side d-flex flex-column align-items-center">
    <img src="{% if author.profile %}{{ author.profile.avatar_url }}{% else %}{% static 'img/user.png' %}{% endif %}" alt="Аватарка" class="question-avatar">
    <span class="question-author" title="{{ author }}">{{ author }}</span>
    <div class="vote-box d-flex flex-column align-items-center" data-vote-url="{{ vote_url }}" data-user-vote="{{ user_vote }}">
        <button type="button" class="btn btn-sm vote-up{% if user_vote == 1 %} active{% endif %}" aria-label="Нравится" data-vote-value="1"
            aria-pressed="{% if user_vote == 1 %}true{% else %}false{% endif %}"
            {% if not user.is_authenticated %}disabled title="Войдите, чтобы поставить оценку"{% elif user_vote == 1 %}disabled title="Вы уже поставили лайк"{% else %}title="Поставить лайк"{% endif %}>▲</button>
        <span class="vote-count fw-bold" aria-live="polite">{{ votes }}</span>
        <button type="button" class="btn btn-sm vote-down{% if user_vote == -1 %} active{% endif %}" aria-label="Не нравится" data-vote-value="-1"
            aria-pressed="{% if user_vote == -1 %}true{% else %}false{% endif %}"
            {% if not user.is_authenticated %}disabled title="Войдите, чтобы поставить оценку"{% elif user_vote == -1 %}disabled title="Вы уже поставили дизлайк"{% else %}title="Поставить дизлайк"{% endif %}>▼</button>
    </div>
</div>

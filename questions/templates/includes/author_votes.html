{% load static %}
<div class="question-side d-flex flex-column align-items-center">
    <img src="{% static 'img/user.png' %}" alt="Аватарка" class="question-avatar">
    <span class="question-author" title="{{ author }}">{{ author }}</span>
    <div class="vote-box d-flex flex-column align-items-center">
        <button type="button" class="btn btn-sm vote-up{% if vote_position == 2 %} active{% endif %}" aria-label="Нравится"
            aria-pressed="{% if vote_position == 2 %}true{% else %}false{% endif %}">▲</button>
        <span class="vote-count fw-bold">{{ votes }}</span>
        <button type="button" class="btn btn-sm vote-down{% if vote_position == 3 %} active{% endif %}" aria-label="Не нравится"
            aria-pressed="{% if vote_position == 3 %}true{% else %}false{% endif %}">▼</button>
    </div>
</div>

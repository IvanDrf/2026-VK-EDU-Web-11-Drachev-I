{% extends "base.html" %}

{% block title %}Задать вопрос — AskHub{% endblock %}

{% block content %}
<div class="card question-card">
    <div class="card-body">
        <h5 class="card-title">Задать вопрос</h5>
        <form action="{% url 'ask' %}" method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="question-title" class="form-label">Название вопроса</label>
                <input type="text" class="form-control" id="question-title" name="title"
                    placeholder="Например: Что лучше Django или FastAPI?" maxlength="150" required>
            </div>

            <div class="mb-4">
                <label for="question-text" class="form-label">Текст вопроса</label>
                <textarea class="form-control" id="question-text" name="text" rows="8"
                    placeholder="Опишите ситуацию подробно" required></textarea>
            </div>

            <div class="mb-4">
                <label for="question-tags" class="form-label">Теги</label>
                <input type="text" class="form-control" id="question-tags" name="tags"
                    placeholder="python, django, fastapi">
            </div>

            <a href="{% url 'index' %}" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Опубликовать вопрос</button>
        </form>
    </div>
</div>
{% endblock %}
